<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR그룹 팀별 담당자 안내</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-red: #f02d4e;
            --bg-gray: #f4f5f7;
            --card-bg: #ffffff;
            --text-dark: #111111;
            --text-muted: #767676;
            --border-color: #ebebeb;
            --drawer-width: 480px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, Roboto, "Segoe UI", sans-serif;
            background-color: var(--bg-gray);
            color: var(--text-dark);
            line-height: 1.5;
        }

        /* 헤더 영역 */
        .app-header {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border-color);
            padding: 30px 40px 0;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .title-area h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .title-area span {
            font-size: 13px;
            color: var(--text-muted);
            margin-left: 10px;
            font-weight: 400;
        }

        .search-box {
            position: relative;
            width: 320px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 14px;
            background-color: var(--bg-gray);
            outline: none;
            transition: all 0.2s;
        }

        .search-box input:focus {
            background-color: #fff;
            border-color: var(--text-dark);
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        /* 필터 탭 */
        .filter-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 16px;
        }

        .tab-btn {
            border: none;
            background: #f0f0f0;
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--text-dark);
            color: #ffffff;
        }

        /* 메인 콘텐츠 */
        .main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
        }

        .team-section {
            margin-bottom: 50px;
        }

        .team-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .team-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 18px;
            background-color: var(--primary-red);
            border-radius: 2px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* 카드 스타일 */
        .member-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .member-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            border-color: #d1d1d1;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }

        .avatar-badge {
            width: 44px;
            height: 44px;
            background-color: var(--primary-red);
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .member-info h3 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .member-info span {
            font-size: 12px;
            color: var(--text-muted);
        }

        .card-summary {
            font-size: 13px;
            color: #444;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 20px;
            min-height: 40px;
            line-height: 1.5;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            border-top: 1px solid #f6f6f6;
            padding-top: 14px;
        }

        .member-card:hover .card-footer {
            color: var(--primary-red);
        }

        /* 슬라이드 우측 드로어 */
        .drawer-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .drawer-backdrop.active {
            opacity: 1;
            visibility: visible;
        }

        .drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: var(--drawer-width);
            max-width: 90vw;
            height: 100vh;
            background: #ffffff;
            z-index: 101;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.15);
            transform: translateX(100%);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .drawer.active {
            transform: translateX(0);
        }

        .drawer-header {
            padding: 30px 30px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            color: #888;
            cursor: pointer;
            padding: 4px;
        }

        .close-btn:hover {
            color: #111;
        }

        .profile-area {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .profile-avatar {
            width: 60px;
            height: 60px;
            background-color: var(--primary-red);
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        .profile-text .team-name {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .profile-text .member-name {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-dark);
        }

        /* 검은색 담당 업무 상자 */
        .summary-box {
            background-color: #121212;
            color: #ffffff;
            border-radius: 10px;
            padding: 24px;
            margin: 0 30px 30px;
        }

        .summary-box .label {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .summary-box .keywords {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.4;
            word-break: keep-all;
        }

        /* 상세 담당 영역 리스트 */
        .detail-section {
            padding: 0 30px 40px;
            flex: 1;
        }

        .detail-section h4 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .task-list {
            list-style: none;
        }

        .task-item {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 16px 0;
            border-bottom: 1px solid #f6f6f6;
        }

        .task-num {
            font-size: 13px;
            font-weight: 800;
            color: var(--primary-red);
            min-width: 20px;
            padding-top: 2px;
        }

        .task-content .task-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .task-content .task-desc {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            .app-header {
                padding: 20px 20px 0;
            }
            .main-content {
                padding: 20px;
            }
            .search-box {
                width: 100%;
            }
            .header-top {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
        }
    </style>
</head>

                    {
                        name: "이성훈",
                        summary: "휴양시설 · 선택적복리후생비 · 경조물품 · 임신&출산 · 학자금 · 위탁보육",
                        tasks: [
                            { title: "휴양시설", desc: "콘도/휴양소 등" },
                            { title: "선택적복리후생비", desc: "선택적복리후생 베네피아 문의" },
                            { title: "경조물품", desc: "경조화환/용품 문의" },
                            { title: "임신&출산 축하선물", desc: "임신/출산 축하 선물 지원" },
                            { title: "자녀학자금", desc: "자녀학자금" },
                            { title: "위탁보육지원", desc: "영유아 위탁보육지원" }
                        ]
                    },
                    {
                        name: "박태훈",
                        summary: "의료비 · 어학시험지원 · 출장 · Wellness Center · 통신비",
                        tasks: [
                            { title: "의료비", desc: "본인, 가족 의료비 신청/ 재검비용 신청,정산" },
                            { title: "어학시험지원", desc: "TOEIC, TOEIC Speaking, OPIC 등 어학" },
                            { title: "출장", desc: "국내외 출장 등록/정산 관련 문의" },
                            { title: "Wellness Center", desc: "안마 이용 문의" },
                            { title: "통신비", desc: "요금지원, 국제전화, 로밍(출장)" }
                        ]
                    },
                    {
                        name: "서동석",
                        summary: "제휴 · 제증명 · Post Center · 법인차량 · ID카드 · 명함",
                        tasks: [
                            { title: "제휴", desc: "제휴 문의" },
                            { title: "제증명", desc: "재직,경력, 갑근세, 근로소득원천징수 증명서" },
                            { title: "Post Center", desc: "퀵, 택배, 국제우편, 등기" },
                            { title: "법인차량", desc: "임원 및 업무용 차량 관리" },
                            { title: "ID카드", desc: "ID카드 발급, 소모품(케이스, 목줄)" },
                            { title: "명함", desc: "명함제작 문의" }
                        ]
                    }
                ]
            }
        ];

        let currentTeam = 'all';
        let searchQuery = '';

        function getAvatarText(name) {
            return name.length > 2 ? name.slice(-2) : name;
        }

        function render() {
            const container = document.getElementById('contentContainer');
            container.innerHTML = '';

            hrData.forEach(teamObj => {
                if (currentTeam !== 'all' && teamObj.team !== currentTeam) return;

                const filteredMembers = teamObj.members.filter(m => {
                    if (!searchQuery) return true;
                    const query = searchQuery.toLowerCase();
                    const nameMatch = m.name.toLowerCase().includes(query);
                    const summaryMatch = m.summary.toLowerCase().includes(query);
                    const taskMatch = m.tasks.some(t => t.title.toLowerCase().includes(query) || t.desc.toLowerCase().includes(query));
                    return nameMatch || summaryMatch || taskMatch;
                });

                if (filteredMembers.length === 0) return;

                const section = document.createElement('section');
                section.className = 'team-section';

                const teamTitle = document.createElement('h2');
                teamTitle.className = 'team-title';
                teamTitle.textContent = teamObj.team;
                section.appendChild(teamTitle);

                const cardGrid = document.createElement('div');
                cardGrid.className = 'card-grid';

                filteredMembers.forEach(member => {
                    const card = document.createElement('div');
                    card.className = 'member-card';
                    card.onclick = () => openDrawer(teamObj.team, member);

                    card.innerHTML = `
                        <div>
                            <div class="card-header">
                                <div class="avatar-badge">${getAvatarText(member.name)}</div>
                                <div class="member-info">
                                    <h3>${member.name}</h3>
                                    <span>${teamObj.team}</span>
                                </div>
                            </div>
                            <div class="card-summary">${member.summary}</div>
                        </div>
                        <div class="card-footer">
                            <span>담당 업무 보기</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </div>
                    `;
                    cardGrid.appendChild(card);
                });

                section.appendChild(cardGrid);
                container.appendChild(section);
            });

            if (container.children.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 60px 0; color: #888;">검색 결과가 없습니다.</div>`;
            }
        }

        function openDrawer(teamName, member) {
            document.getElementById('drawerAvatar').textContent = getAvatarText(member.name);
            document.getElementById('drawerTeam').textContent = teamName;
            document.getElementById('drawerName').textContent = member.name;
            document.getElementById('drawerKeywords').textContent = member.summary.split(' · ').join(' · ');

            const taskList = document.getElementById('drawerTaskList');
            taskList.innerHTML = '';

            member.tasks.forEach((task, index) => {
                const numStr = String(index + 1).padStart(2, '0');
                const li = document.createElement('li');
                li.className = 'task-item';
                li.innerHTML = `
                    <div class="task-num">${numStr}</div>
                    <div class="task-content">
                        <div class="task-title">${task.title}</div>
                        <div class="task-desc">${task.desc}</div>
                    </div>
                `;
                taskList.appendChild(li);
            });

            document.getElementById('drawerBackdrop').classList.add('active');
            document.getElementById('drawer').classList.add('active');
        }

        function closeDrawer() {
            document.getElementById('drawerBackdrop').classList.remove('active');
            document.getElementById('drawer').classList.remove('active');
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentTeam = e.target.getAttribute('data-team');
                render();
            });
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            render();
        });

        document.getElementById('closeDrawerBtn').addEventListener('click', closeDrawer);
        document.getElementById('drawerBackdrop').addEventListener('click', closeDrawer);

        render();
    </script>
</body>
</html>
