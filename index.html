    <style>

            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

            padding: 20px;
            background-color: var(--bg-color);
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        header {
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        h1 {
            margin: 0;
            color: #1a1a1a;
            font-size: 24px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        /* 검색 및 필터 영역 */
        .search-container {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-container select, 
        .search-container input {
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .search-container select {
            min-width: 180px;
            background-color: #fff;
        }

        .search-container input {
            flex: 1;
            min-width: 250px;
        }

        .search-container input:focus,
        .search-container select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(0, 86, 179, 0.1);
        }

        /* 테이블 스타일 */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th, td {
            padding: 12px 16px;
            border: 1px solid var(--border-color); /* 병합 구분을 위해 테두리 선 보완 */
            vertical-align: middle; /* 병합된 셀 중앙 정렬 */
        }

        th {
            background-color: #f1f3f5;
            color: #495057;
            font-weight: 600;
            white-space: nowrap;
            text-align: center;
        }

        tbody tr:hover {
            background-color: #f8f9fa;
        }

        .badge-team {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            background-color: #e7f5ff;
            color: #1971c2;
        }

        .manager-name {
            font-weight: 600;
            color: #2b8a3e;
            white-space: nowrap;
        }

        .no-result {
            text-align: center;
            padding: 40px;
            color: #868e96;
        }
    </style>
</head>

// 테이블 랜더링 (조직, 구분 자동 병합 적용)
function renderTable(data) {
    const tableBody = document.getElementById('hrTableBody');
    tableBody.innerHTML = '';

    if (data.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="5" class="no-result">검색 결과가 없습니다.</td></tr>`;
        return;
    }

    for (let i = 0; i < data.length; i++) {
        const row = document.createElement('tr');
        const item = data[i];

        // 1. 조직/Cell 병합(rowspan) 계산
        let isFirstTeam = (i === 0) || (data[i - 1].team !== item.team);
        if (isFirstTeam) {
            let teamSpan = 1;
            for (let j = i + 1; j < data.length; j++) {
                if (data[j].team === item.team) teamSpan++;
                else break;
            }
            const tdTeam = document.createElement('td');
            tdTeam.rowSpan = teamSpan;
            tdTeam.innerHTML = `<span class="badge-team">${item.team}</span>`;
            row.appendChild(tdTeam);
        }

        // 2. 업무구분 병합(rowspan) 계산
        let isFirstCategory = (i === 0) || (data[i - 1].team !== item.team) || (data[i - 1].category !== item.category);
        if (isFirstCategory) {
            let categorySpan = 1;
            for (let j = i + 1; j < data.length; j++) {
                if (data[j].team === item.team && data[j].category === item.category) categorySpan++;
                else break;
            }
            const tdCategory = document.createElement('td');
            tdCategory.rowSpan = categorySpan;
            tdCategory.textContent = item.category;
            row.appendChild(tdCategory);
        }

        // 3. 나머지 개별 항목들 (업무명, 상세 내용, 담당자)
        row.innerHTML += `
            <td><strong>${item.name}</strong></td>
            <td>${item.detail}</td>
            <td><span class="manager-name">${item.manager}</span></td>
        `;

        tableBody.appendChild(row);
    }
}

// 필터링 및 검색 함수
function filterData() {
    const selectedTeam = document.getElementById('teamFilter').value;
    const searchText = document.getElementById('searchInput').value.toLowerCase().trim();

    const filtered = hrData.filter(item => {
        const matchesTeam = selectedTeam === '' || item.team === selectedTeam;
        const matchesSearch = 
            item.team.toLowerCase().includes(searchText) ||
            item.category.toLowerCase().includes(searchText) ||
            item.name.toLowerCase().includes(searchText) ||
            item.detail.toLowerCase().includes(searchText) ||
            item.manager.toLowerCase().includes(searchText);

        return matchesTeam && matchesSearch;
    });

    renderTable(filtered);
}

// 초기 테이블 랜더링
renderTable(hrData);
</script>
